[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgcc-balance"
version = "0.1.0"
description = "电费余额查询命令行工具：HTTP 查询 + ADB 自动刷新登录凭证"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["electricity", "balance", "cli", "电费", "电表"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31",
    "gmssl>=3.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/TwitterIsGood/my-craw"
Issues = "https://github.com/TwitterIsGood/my-craw/issues"

[project.scripts]
sgcc = "sgcc.cli:main"

[tool.setuptools.packages.find]
include = ["sgcc*"]
