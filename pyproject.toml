[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgcc-balance"
version = "0.1.0"
description = "网上国网电费余额命令行：纯 HTTP 查询 + ADB 自动登录刷新 token"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sgcc", "electricity", "balance", "cli", "国网", "电费"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31",
    "gmssl>=3.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/TwitterIsGood/my-craw"
Issues = "https://github.com/TwitterIsGood/my-craw/issues"

[project.scripts]
sgcc = "sgcc.cli:main"

[tool.setuptools.packages.find]
include = ["sgcc*"]
